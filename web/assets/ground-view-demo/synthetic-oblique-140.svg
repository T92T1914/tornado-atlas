<desc id="description">Independent ideal-pinhole projection of an authored axisymmetric side surface and four fixed scene markers. Camera synthetic-oblique, shared-player second 140. No historical source image, geographic registration, wind field, cloud-base particle boundary or soft particle edge is represented. Top and base joins are display closures.</desc>
