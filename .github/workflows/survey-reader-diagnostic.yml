name: Survey reader reload diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/survey-reader-diagnostic.yml'
      - 'tests/browser/tuscaloosa-survey-reader.test.mjs'
      - 'web/tuscaloosa-survey-reader.mjs'
permissions:
  contents: read
jobs:
  reload-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: atlas-survey-reload-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the locked browser dependency
        run: npm ci --ignore-scripts --no-fund
      - name: Install the isolated WebKit engine
        run: npx playwright install --with-deps webkit
      - name: Observe the unchanged survey-reader journeys
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 tests/browser/tuscaloosa-survey-reader.test.mjs
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-reload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics
          if-no-files-found: error
          retention-days: 7
