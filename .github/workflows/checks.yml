name: Verify and publish museum
on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: atlas-verify-source-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact checked-out source
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$ATLAS_EXPECTED_SHA"
          printf 'ATLAS_SOURCE_IDENTITY sha=%s tree=%s web_tree=%s\n' "$actual_sha" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse HEAD:web)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the committed conceptual graphic
        run: python tools/render_mechanism.py --check
      - name: Verify parsers and source preservation
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: |
          node --check web/jma.js
          node --test tests/jma-model.test.mjs
          node --check web/dossier.mjs
          node --check web/dossier-file-model.mjs
          node --test tests/dossier-file-model.test.mjs
          node --check web/evidence-comparison.mjs
          node --test tests/evidence-comparison.test.mjs
          node --check web/dossier-literal-model.mjs
          node --check web/revision-comparison.mjs
          node --test tests/revision-comparison.test.mjs
          node --test tests/archive-discovery-model.test.mjs
          node --check web/curator.mjs
          node --check web/app.js
          node --check web/appearance.js
          node --check web/atlas.js
          node --check web/explorer-map.mjs
          node --test tests/explorer-model.test.mjs tests/explorer-map.test.mjs
          node --check web/study.js
          node --check web/lab-viewport.mjs
          node --check web/lab-context.mjs
          node --check web/lab-reference-view.mjs
          node --test tests/lab-viewport.test.mjs
          node --check web/radar-source-model.mjs
          node --check web/radar-source-reader.mjs
          node --test tests/radar-source-model.test.mjs
          node --check web/partial-form-geometry.mjs
          node --check web/form-renderer.mjs
          node --check web/funnel-simulation-model.mjs
          node --check web/formation-model.mjs
          node --test tests/formation-model.test.mjs
          node --check web/funnel-lighting-model.mjs
          node --test tests/funnel-lighting-model.test.mjs tests/experiment-state.test.mjs
          node --test tests/reference-form-experiment.test.mjs tests/reference-form-field.test.mjs tests/storm-scene-model.test.mjs tests/storm-scene-experiment.test.mjs tests/storm-detail-model.test.mjs tests/storm-integrated-experiment.test.mjs
          node --check web/source-camera-model.mjs
          node --check web/ground-view-model.mjs
          node --check web/ground-view.mjs
          node --test tests/source-camera-model.test.mjs tests/ground-view-probe.test.mjs tests/funnel-simulation-model.test.mjs
          node --test tests/form-renderer-resource-ownership.test.mjs
          node --check web/documentary-appearance.mjs
          node --check web/documentary-media.mjs
          node --check web/reconstruction.js
          node --check web/replay-scale-impact-view.mjs
          node --check web/appearance-timeline-model.mjs
          node --check web/replay-context-model.mjs
          node --check web/chronology-view.mjs
          node --test tests/chronology-model.test.mjs
          node --check web/chronology-radar-model.mjs
          node --check web/chronology-radar-view.mjs
          node --test tests/chronology-radar-model.test.mjs
          node --test tests/chronology-clock-controls.test.mjs
          node --test tests/event-package-model.test.mjs
          node --test tests/appearance-timeline.test.mjs
          node --test tests/photo-observations.test.mjs tests/partial-photo-forms.test.mjs tests/partial-margin-geometry.test.mjs tests/partial-condensation.test.mjs tests/source-photo-context.test.mjs tests/nolte-full-documentary.test.mjs
          node --test tests/replay-context.test.mjs
          node --test tests/reconstruction-model.test.mjs tests/reconstruction-share-consumer.test.mjs
          node --check web/wind.js
          node --check web/wind-tracer.mjs
          node --test tests/wind-tracer.test.mjs tests/wind-spatial-interpretation.test.mjs
          node --check web/passage.js
          node --test tests/passage-clock-controls.test.mjs
          node --test tests/passage-values.test.mjs
          node --test tests/wind-numeric-acceptance.test.mjs tests/no-script-image.test.mjs
          node tools/build_wind_sample_table.mjs --check
          node --check web/damage-view.mjs
          node --check web/photo-view.mjs
          node --check web/tuscaloosa-radar-view.mjs
          node --test tests/photo-view.test.mjs
          node --check web/tuscaloosa-survey-reader.mjs
          node --check web/tuscaloosa-damage-map.mjs
          node --test tests/tuscaloosa-reader-history.test.mjs tests/tuscaloosa-request-contract.test.mjs
          node --check web/notebook-view.mjs
          node --test tests/notebook-view.test.mjs
          node --check web/reader-view.mjs
          node --check web/survey-page.mjs
          node --test tests/source-filter.test.mjs
          node --check web/timeline-media.mjs
          node --check web/community-view.mjs
          node --check web/places-view.mjs
          node --check web/map-navigation.mjs
          node --check web/impact-view.mjs
          node --check web/fatality-view.mjs
          node --check web/survey-view.mjs
          node --test tests/survey-route.test.mjs
          node --check web/survey-photos.mjs
          node --check web/camera-view.mjs
          node --check web/replay-camera-view.mjs
          node --test tests/camera-model.test.mjs
          node --check web/playback-model.mjs
          node --check web/documentary-view.mjs
          node --check web/geography-view.mjs
          node --test tests/geography-view.test.mjs tests/geography-raster-size.test.mjs
          node --check web/damage-explanation.mjs
          node --check web/footage-view.mjs
          node --test tests/footage-model.test.mjs
          node --test tests/bounded-form.test.mjs tests/documentary-sources.test.mjs tests/study-clock-controls.test.mjs
          node --test tests/documentary-audit-lifecycle.test.mjs
          node --test tests/atlas-model.test.mjs tests/vortex-model.test.mjs tests/wind-model.test.mjs tests/timeline-media.test.mjs tests/component-model.test.mjs tests/evolution-model.test.mjs tests/survey-model.test.mjs tests/playback-model.test.mjs tests/map-navigation.test.mjs tests/impact-model.test.mjs tests/documentary-model.test.mjs
      - name: Verify checked-in exhibit
        run: |
          python tools/check_exhibit.py
          python tools/check_catalogue.py
          python tools/check_archive.py
          python tools/check_jma_cases.py
      - name: Require unchanged tracked source inputs
        if: ${{ !cancelled() }}
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$ATLAS_EXPECTED_SHA"
          if ! git diff --quiet HEAD --; then
            git status --short --untracked-files=no
            echo "Verification changed tracked source inputs." >&2
            exit 1
          fi
  verify-browser:
    name: Verify full browser journeys (${{ matrix.engine }}, ${{ matrix.part }}/${{ matrix.total }})
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - engine: chromium
            channel: chrome
            part: 1
            total: 2
          - engine: chromium
            channel: chrome
            part: 2
            total: 2
          - engine: webkit
            channel: ''
            part: 1
            total: 2
          - engine: webkit
            channel: ''
            part: 2
            total: 2
          - engine: firefox
            channel: ''
            part: 1
            total: 2
          - engine: firefox
            channel: ''
            part: 2
            total: 2
    concurrency:
      group: atlas-verify-browser-${{ matrix.engine }}-${{ matrix.part }}-of-${{ matrix.total }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact checked-out source
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$ATLAS_EXPECTED_SHA"
          printf 'ATLAS_SOURCE_IDENTITY sha=%s tree=%s web_tree=%s\n' "$actual_sha" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse HEAD:web)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select existing HTTPS Ubuntu archive fallback
        if: ${{ runner.environment == 'github-hosted' && matrix.engine != 'chromium' }}
        run: |
          sudo python3 - <<'ATLAS_APT_MIRROR_PY'
          from pathlib import Path
          import os
          import stat

          mirror = Path('/etc/apt/apt-mirrors.txt')
          azure_uri = b'http://azure.archive.ubuntu.com/ubuntu/'
          archive_uri = b'https://archive.ubuntu.com/ubuntu/'
          identity = lambda item: (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns)
          initial = mirror.lstat()
          if not stat.S_ISREG(initial.st_mode) or initial.st_size > 4096:
              raise SystemExit('Expected a regular Ubuntu mirror file of at most 4096 bytes.')
          flags = os.O_RDWR | getattr(os, 'O_BINARY', 0) | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_NONBLOCK', 0)
          descriptor = os.open(mirror, flags)
          try:
              opened = os.fstat(descriptor)
              if not stat.S_ISREG(opened.st_mode) or identity(opened) != identity(initial):
                  raise SystemExit('Ubuntu mirror file changed before validation.')
              mirror_bytes = os.read(descriptor, 4097)
              if len(mirror_bytes) > 4096 or len(mirror_bytes) != opened.st_size:
                  raise SystemExit('Ubuntu mirror file is oversized or changed while reading.')
              lines = mirror_bytes.splitlines(keepends=True)
              first_token = lambda line: line.split()[0] if line.split() else None
              if not any(first_token(line) == archive_uri for line in lines):
                  raise SystemExit('The existing exact HTTPS Ubuntu archive fallback is missing.')
              revised = b''.join(line for line in lines if first_token(line) != azure_uri)
              if revised != mirror_bytes:
                  current = mirror.lstat()
                  if not stat.S_ISREG(current.st_mode) or identity(current) != identity(opened) or identity(os.fstat(descriptor)) != identity(opened):
                      raise SystemExit('Ubuntu mirror file changed before the bounded update.')
                  os.lseek(descriptor, 0, os.SEEK_SET)
                  written = 0
                  while written < len(revised):
                      amount = os.write(descriptor, revised[written:])
                      if amount <= 0:
                          raise OSError('Ubuntu mirror write made no progress.')
                      written += amount
                  os.ftruncate(descriptor, len(revised))
              print(f'Removed {len(lines) - len(revised.splitlines(keepends=True))} exact Azure HTTP mirror entries. Retained existing HTTPS fallbacks.')
          finally:
              os.close(descriptor)
          ATLAS_APT_MIRROR_PY
      - name: Install browser test dependencies
        id: browser_dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Verify the complete selected browser suite
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: ${{ matrix.engine }}
          ATLAS_BROWSER_CHANNEL: ${{ matrix.channel }}
          ATLAS_TEST_SHARD: ${{ matrix.part }}/${{ matrix.total }}
        run: |
          case "$ATLAS_BROWSER_ENGINE" in
            chromium)
              python tools/run_browser_checks.py chromium -- node --test --test-concurrency=1 --test-reporter=tap --test-shard="$ATLAS_TEST_SHARD" tests/browser/*.test.mjs
              ;;
            webkit)
              npx playwright install --with-deps webkit
              python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 --test-reporter=tap --test-shard="$ATLAS_TEST_SHARD" tests/browser/*.test.mjs
              ;;
            firefox)
              npx playwright install --with-deps firefox
              python tools/run_browser_checks.py firefox -- node --test --test-concurrency=1 --test-reporter=tap --test-shard="$ATLAS_TEST_SHARD" tests/browser/*.test.mjs
              ;;
            *)
              echo "Unknown full browser engine." >&2
              exit 1
              ;;
          esac
      - name: Retain bounded browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.engine }}-${{ matrix.part }}-of-${{ matrix.total }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: warn
  verify:
    needs: [verify-source, verify-browser, verify-player-webkit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: atlas-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require all applicable verification jobs
        env:
          ATLAS_SOURCE_RESULT: ${{ needs.verify-source.result }}
          ATLAS_BROWSER_RESULT: ${{ needs.verify-browser.result }}
          ATLAS_FOCUSED_RESULT: ${{ needs.verify-player-webkit.result }}
          ATLAS_EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$ATLAS_SOURCE_RESULT" = success
          test "$ATLAS_BROWSER_RESULT" = success
          if [ "$ATLAS_EVENT_NAME" = pull_request ]; then
            test "$ATLAS_FOCUSED_RESULT" = success
          else
            test "$ATLAS_FOCUSED_RESULT" = skipped
          fi
  verify-player-webkit:
    name: Verify player WebKit and Firefox
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: atlas-player-webkit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact checked-out source
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$ATLAS_EXPECTED_SHA"
          printf 'ATLAS_SOURCE_IDENTITY sha=%s tree=%s web_tree=%s\n' "$actual_sha" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse HEAD:web)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select existing HTTPS Ubuntu archive fallback
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo python3 - <<'ATLAS_APT_MIRROR_PY'
          from pathlib import Path
          import os
          import stat

          mirror = Path('/etc/apt/apt-mirrors.txt')
          azure_uri = b'http://azure.archive.ubuntu.com/ubuntu/'
          archive_uri = b'https://archive.ubuntu.com/ubuntu/'
          identity = lambda item: (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns)
          initial = mirror.lstat()
          if not stat.S_ISREG(initial.st_mode) or initial.st_size > 4096:
              raise SystemExit('Expected a regular Ubuntu mirror file of at most 4096 bytes.')
          flags = os.O_RDWR | getattr(os, 'O_BINARY', 0) | getattr(os, 'O_NOFOLLOW', 0) | getattr(os, 'O_NONBLOCK', 0)
          descriptor = os.open(mirror, flags)
          try:
              opened = os.fstat(descriptor)
              if not stat.S_ISREG(opened.st_mode) or identity(opened) != identity(initial):
                  raise SystemExit('Ubuntu mirror file changed before validation.')
              mirror_bytes = os.read(descriptor, 4097)
              if len(mirror_bytes) > 4096 or len(mirror_bytes) != opened.st_size:
                  raise SystemExit('Ubuntu mirror file is oversized or changed while reading.')
              lines = mirror_bytes.splitlines(keepends=True)
              first_token = lambda line: line.split()[0] if line.split() else None
              if not any(first_token(line) == archive_uri for line in lines):
                  raise SystemExit('The existing exact HTTPS Ubuntu archive fallback is missing.')
              revised = b''.join(line for line in lines if first_token(line) != azure_uri)
              if revised != mirror_bytes:
                  current = mirror.lstat()
                  if not stat.S_ISREG(current.st_mode) or identity(current) != identity(opened) or identity(os.fstat(descriptor)) != identity(opened):
                      raise SystemExit('Ubuntu mirror file changed before the bounded update.')
                  os.lseek(descriptor, 0, os.SEEK_SET)
                  written = 0
                  while written < len(revised):
                      amount = os.write(descriptor, revised[written:])
                      if amount <= 0:
                          raise OSError('Ubuntu mirror write made no progress.')
                      written += amount
                  os.ftruncate(descriptor, len(revised))
              print(f'Removed {len(lines) - len(revised.splitlines(keepends=True))} exact Azure HTTP mirror entries. Retained existing HTTPS fallbacks.')
          finally:
              os.close(descriptor)
          ATLAS_APT_MIRROR_PY
      - name: Install focused WebKit dependencies
        id: focused_browser_dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps webkit
      - name: Verify survey recovery, Udall reading and laboratory references in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py --output ci-diagnostics/udall-focused webkit -- node --test --test-concurrency=1 tests/browser/ground-view.test.mjs tests/browser/survey-photo-recovery.test.mjs tests/browser/udall-aftermath.test.mjs tests/browser/laboratory-reading-evidence.test.mjs
      - name: Verify museum reading and map sizes in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
          ATLAS_MUSEUM_CAPTURE_DIR: ci-diagnostics/museum-reading
        run: python tools/run_browser_checks.py --output ci-diagnostics/museum-reading webkit -- node --test --test-concurrency=1 --test-name-pattern='slow dossier|Blackwell shares heading|essential El Reno reading and museum navigation reflow|responsive and expanded maps|purposeful reading route|unenhanced entry pages' tests/browser/dossier.test.mjs tests/browser/tuscaloosa-exhibit.test.mjs tests/browser/museum-reading.test.mjs tests/browser/maps.test.mjs tests/browser/event-reading.test.mjs
      - name: Verify player layout, survey history and evidence comparison in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 tests/browser/replay-damage.test.mjs tests/browser/survey-history.test.mjs tests/browser/tuscaloosa-satellite-context.test.mjs tests/browser/tuscaloosa-damage-map.test.mjs tests/browser/tuscaloosa-focus-ownership.test.mjs tests/browser/footage-sources.test.mjs tests/browser/evidence-comparison.test.mjs tests/browser/dossier-file-verification.test.mjs tests/browser/chronology-radar.test.mjs tests/browser/revision-comparison.test.mjs tests/browser/replay-appearance-reading.test.mjs tests/browser/chapter-contents.test.mjs
      - name: Verify reported appearance reading and native menu reflow in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 --test-name-pattern='early reported-minute|derived film still|additional documentary sources|documentary startup|documentary source controls remain independent' tests/browser/documentary-appearance.test.mjs tests/browser/additional-documentary-media.test.mjs tests/browser/documentary-startup-choice.test.mjs
      - name: Verify laboratory history ownership in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 tests/browser/laboratory-history-rate.test.mjs
      - name: Verify museum reading and map sizes in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
          ATLAS_MUSEUM_CAPTURE_DIR: ci-diagnostics/museum-reading
        run: |
          npx playwright install --with-deps firefox
          python tools/run_browser_checks.py --output ci-diagnostics/museum-reading firefox -- node --test --test-concurrency=1 --test-name-pattern='slow dossier|Blackwell shares heading|essential El Reno reading and museum navigation reflow|responsive and expanded maps|purposeful reading route|unenhanced entry pages' tests/browser/dossier.test.mjs tests/browser/tuscaloosa-exhibit.test.mjs tests/browser/museum-reading.test.mjs tests/browser/maps.test.mjs tests/browser/event-reading.test.mjs
      - name: Verify Udall source-only reading and laboratory references in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
        run: python tools/run_browser_checks.py --output ci-diagnostics/udall-focused firefox -- node --test --test-concurrency=1 tests/browser/udall-aftermath.test.mjs tests/browser/laboratory-reading-evidence.test.mjs
      - name: Verify survey photo and history readiness in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
        run: python tools/run_browser_checks.py firefox -- node --test --test-concurrency=1 tests/browser/survey-history.test.mjs tests/browser/footage-sources.test.mjs tests/browser/evidence-comparison.test.mjs tests/browser/dossier-file-verification.test.mjs tests/browser/chronology-radar.test.mjs tests/browser/revision-comparison.test.mjs tests/browser/chapter-contents.test.mjs tests/browser/documentary-media.test.mjs tests/browser/documentary-startup-choice.test.mjs
      - name: Verify laboratory history ownership in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
        run: python tools/run_browser_checks.py firefox -- node --test --test-concurrency=1 tests/browser/laboratory-history-rate.test.mjs
      - name: Retain focused browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: player-webkit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: warn
  deploy:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact checked-out source
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$ATLAS_EXPECTED_SHA"
          printf 'ATLAS_SOURCE_IDENTITY sha=%s tree=%s web_tree=%s\n' "$actual_sha" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse HEAD:web)"
      - uses: actions/configure-pages@v5
      - name: Require the exact checked-out web tree for publication
        env:
          ATLAS_EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$ATLAS_EXPECTED_SHA"
          git diff --quiet HEAD -- web
          test -z "$(git ls-files --others -- web)"
          printf 'ATLAS_PAGES_SOURCE sha=%s web_tree=%s\n' "$actual_sha" "$(git rev-parse HEAD:web)"
      - uses: actions/upload-pages-artifact@v4
        with:
          # A retry must not leave deploy-pages choosing between same-name artifacts.
          name: github-pages-${{ github.run_attempt }}
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
