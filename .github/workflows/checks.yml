name: Verify catalogue and exhibit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify parsers and source preservation
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: |
          node --check web/app.js
          node --check web/atlas.js
          node --test tests/atlas-model.test.mjs
      - name: Verify checked-in exhibit
        run: |
          python tools/check_exhibit.py
          python tools/check_catalogue.py
