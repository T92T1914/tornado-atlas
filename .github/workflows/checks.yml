name: Verify and publish museum
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify parsers and source preservation
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: |
          node --check web/app.js
          node --check web/appearance.js
          node --check web/atlas.js
          node --check web/explorer-map.mjs
          node --test tests/explorer-model.test.mjs tests/explorer-map.test.mjs
          node --check web/study.js
          node --check web/reconstruction.js
          node --check web/chronology-view.mjs
          node --test tests/chronology-model.test.mjs
          node --test tests/event-package-model.test.mjs
          node --test tests/reconstruction-model.test.mjs
          node --check web/wind.js
          node --check web/passage.js
          node --check web/damage-view.mjs
          node --check web/photo-view.mjs
          node --test tests/photo-view.test.mjs
          node --check web/notebook-view.mjs
          node --test tests/notebook-view.test.mjs
          node --check web/reader-view.mjs
          node --check web/survey-page.mjs
          node --test tests/source-filter.test.mjs
          node --check web/timeline-media.mjs
          node --check web/community-view.mjs
          node --check web/places-view.mjs
          node --check web/map-navigation.mjs
          node --check web/impact-view.mjs
          node --check web/fatality-view.mjs
          node --check web/survey-view.mjs
          node --check web/survey-photos.mjs
          node --check web/camera-view.mjs
          node --check web/replay-camera-view.mjs
          node --test tests/camera-model.test.mjs
          node --check web/playback-model.mjs
          node --check web/documentary-view.mjs
          node --check web/geography-view.mjs
          node --test tests/geography-view.test.mjs
          node --check web/damage-explanation.mjs
          node --check web/footage-view.mjs
          node --test tests/footage-model.test.mjs
          node --test tests/atlas-model.test.mjs tests/vortex-model.test.mjs tests/wind-model.test.mjs tests/timeline-media.test.mjs tests/component-model.test.mjs tests/evolution-model.test.mjs tests/survey-model.test.mjs tests/playback-model.test.mjs tests/map-navigation.test.mjs tests/impact-model.test.mjs tests/documentary-model.test.mjs
      - name: Verify checked-in exhibit
        run: |
          python tools/check_exhibit.py
          python tools/check_catalogue.py
      - name: Verify explorer browser journeys
        env:
          ATLAS_BROWSER_CHANNEL: chrome
        run: |
          npm ci --ignore-scripts --no-fund
          npm run test:browser
      - name: Verify WebKit map and navigation behavior
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: |
          npx playwright install --with-deps webkit
          npm run test:browser
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          # A retry must not leave deploy-pages choosing between same-name artifacts.
          name: github-pages-${{ github.run_attempt }}
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
