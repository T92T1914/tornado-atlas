name: Verify and publish museum
on:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: atlas-verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify parsers and source preservation
        run: python -m unittest discover -s tests -v
      - name: Check browser script
        run: |
          node --check web/jma.js
          node --test tests/jma-model.test.mjs
          node --check web/dossier.mjs
          node --check web/dossier-file-model.mjs
          node --test tests/dossier-file-model.test.mjs
          node --check web/evidence-comparison.mjs
          node --test tests/evidence-comparison.test.mjs
          node --check web/dossier-literal-model.mjs
          node --check web/revision-comparison.mjs
          node --test tests/revision-comparison.test.mjs
          node --test tests/archive-discovery-model.test.mjs
          node --check web/curator.mjs
          node --check web/app.js
          node --check web/appearance.js
          node --check web/atlas.js
          node --check web/explorer-map.mjs
          node --test tests/explorer-model.test.mjs tests/explorer-map.test.mjs
          node --check web/study.js
          node --check web/form-renderer.mjs
          node --check web/reconstruction.js
          node --check web/appearance-timeline-model.mjs
          node --check web/replay-context-model.mjs
          node --check web/chronology-view.mjs
          node --test tests/chronology-model.test.mjs
          node --check web/chronology-radar-model.mjs
          node --check web/chronology-radar-view.mjs
          node --test tests/chronology-radar-model.test.mjs
          node --test tests/chronology-clock-controls.test.mjs
          node --test tests/event-package-model.test.mjs
          node --test tests/appearance-timeline.test.mjs
          node --test tests/replay-context.test.mjs
          node --test tests/reconstruction-model.test.mjs tests/reconstruction-share-consumer.test.mjs
          node --check web/wind.js
          node --check web/passage.js
          node --test tests/passage-clock-controls.test.mjs
          node --test tests/passage-values.test.mjs
          node --test tests/wind-numeric-acceptance.test.mjs tests/no-script-image.test.mjs
          node tools/build_wind_sample_table.mjs --check
          node --check web/damage-view.mjs
          node --check web/photo-view.mjs
          node --check web/tuscaloosa-radar-view.mjs
          node --test tests/photo-view.test.mjs
          node --check web/tuscaloosa-survey-reader.mjs
          node --test tests/tuscaloosa-reader-history.test.mjs tests/tuscaloosa-request-contract.test.mjs
          node --check web/notebook-view.mjs
          node --test tests/notebook-view.test.mjs
          node --check web/reader-view.mjs
          node --check web/survey-page.mjs
          node --test tests/source-filter.test.mjs
          node --check web/timeline-media.mjs
          node --check web/community-view.mjs
          node --check web/places-view.mjs
          node --check web/map-navigation.mjs
          node --check web/impact-view.mjs
          node --check web/fatality-view.mjs
          node --check web/survey-view.mjs
          node --test tests/survey-route.test.mjs
          node --check web/survey-photos.mjs
          node --check web/camera-view.mjs
          node --check web/replay-camera-view.mjs
          node --test tests/camera-model.test.mjs
          node --check web/playback-model.mjs
          node --check web/documentary-view.mjs
          node --check web/geography-view.mjs
          node --test tests/geography-view.test.mjs
          node --check web/damage-explanation.mjs
          node --check web/footage-view.mjs
          node --test tests/footage-model.test.mjs
          node --test tests/bounded-form.test.mjs tests/documentary-sources.test.mjs tests/study-clock-controls.test.mjs
          node --test tests/atlas-model.test.mjs tests/vortex-model.test.mjs tests/wind-model.test.mjs tests/timeline-media.test.mjs tests/component-model.test.mjs tests/evolution-model.test.mjs tests/survey-model.test.mjs tests/playback-model.test.mjs tests/map-navigation.test.mjs tests/impact-model.test.mjs tests/documentary-model.test.mjs
      - name: Verify checked-in exhibit
        run: |
          python tools/check_exhibit.py
          python tools/check_catalogue.py
          python tools/check_archive.py
          python tools/check_jma_cases.py
      - name: Install browser test dependencies
        id: browser_dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Verify explorer browser journeys
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_CHANNEL: chrome
        run: |
          python tools/run_browser_checks.py chromium -- npm run test:browser
      - name: Verify WebKit map and navigation behavior
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: |
          npx playwright install --with-deps webkit
          python tools/run_browser_checks.py webkit -- npm run test:browser
      - name: Verify Firefox catalogue and exhibit journeys
        if: ${{ !cancelled() && steps.browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
        run: |
          npx playwright install --with-deps firefox
          python tools/run_browser_checks.py firefox -- npm run test:browser
      - name: Retain bounded browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: warn
  verify-player-webkit:
    name: Verify player WebKit and Firefox
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: atlas-player-webkit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused WebKit dependencies
        id: focused_browser_dependencies
        run: |
          npm ci --ignore-scripts --no-fund
          npx playwright install --with-deps webkit
      - name: Verify museum reading and map sizes in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
          ATLAS_MUSEUM_CAPTURE_DIR: ci-diagnostics/museum-reading
        run: python tools/run_browser_checks.py --output ci-diagnostics/museum-reading webkit -- node --test --test-concurrency=1 --test-name-pattern='slow dossier|Blackwell shares heading|essential El Reno reading and museum navigation reflow|responsive and expanded maps|purposeful reading route|unenhanced entry pages' tests/browser/dossier.test.mjs tests/browser/tuscaloosa-exhibit.test.mjs tests/browser/museum-reading.test.mjs tests/browser/maps.test.mjs tests/browser/event-reading.test.mjs
      - name: Verify player layout, survey history and evidence comparison in WebKit
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: webkit
        run: python tools/run_browser_checks.py webkit -- node --test --test-concurrency=1 tests/browser/replay-damage.test.mjs tests/browser/survey-history.test.mjs tests/browser/tuscaloosa-satellite-context.test.mjs tests/browser/footage-sources.test.mjs tests/browser/evidence-comparison.test.mjs tests/browser/dossier-file-verification.test.mjs tests/browser/chronology-radar.test.mjs tests/browser/revision-comparison.test.mjs
      - name: Verify museum reading and map sizes in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
          ATLAS_MUSEUM_CAPTURE_DIR: ci-diagnostics/museum-reading
        run: |
          npx playwright install --with-deps firefox
          python tools/run_browser_checks.py --output ci-diagnostics/museum-reading firefox -- node --test --test-concurrency=1 --test-name-pattern='slow dossier|Blackwell shares heading|essential El Reno reading and museum navigation reflow|responsive and expanded maps|purposeful reading route|unenhanced entry pages' tests/browser/dossier.test.mjs tests/browser/tuscaloosa-exhibit.test.mjs tests/browser/museum-reading.test.mjs tests/browser/maps.test.mjs tests/browser/event-reading.test.mjs
      - name: Verify survey photo and history readiness in Firefox
        if: ${{ !cancelled() && steps.focused_browser_dependencies.outcome == 'success' }}
        env:
          ATLAS_BROWSER_ENGINE: firefox
        run: python tools/run_browser_checks.py firefox -- node --test --test-concurrency=1 tests/browser/survey-history.test.mjs tests/browser/footage-sources.test.mjs tests/browser/evidence-comparison.test.mjs tests/browser/dossier-file-verification.test.mjs tests/browser/chronology-radar.test.mjs tests/browser/revision-comparison.test.mjs
      - name: Retain focused browser failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: player-webkit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/
          retention-days: 7
          if-no-files-found: warn
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          # A retry must not leave deploy-pages choosing between same-name artifacts.
          name: github-pages-${{ github.run_attempt }}
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
